# Canonical text for scripted tasks, keyed by dataset and task.
#
# Forced alignment needs a transcript. NeuroVoz ships a verbatim transcript per
# recording, so it does not appear here. For the other corpora the prompt is
# fixed by task, and the same text applies to every speaker.
#
# A prompt is what the speaker was ASKED to say, not necessarily what they
# said. Reading errors, repetitions and omissions are common in dysarthric
# speech, and an aligner given a text the speaker did not produce will place
# boundaries confidently in the wrong place. Alignment quality per file must
# be checked rather than assumed.
#
# `text_extended` is an optional longer variant of the same task. The aligner
# tries both and keeps the higher-scoring one. Used for MDVR-KCL read_text,
# where some speakers also read a second passage.

prompts:

  ItalianPD:
    read_words:
      # Verbatim from the corpus itself: the one .txt bundled with the audio,
      # 15 Young Healthy Control/Alberto R/PR1LBULCAAS94M100120171015..txt,
      # which is the authors' intelligibility scoring sheet for task PR1 and
      # lists the 50-word prompt.
      source: "in-corpus (PR1 scoring sheet)"
      text: >-
        pipa buco topo dado casa gatto filo vaso muro neve luna rete zero scia
        ciao giro sole uomo iuta gnomo glielo pozzo brodo plagio treno classe
        grigio flotta creta drago frate spesa stufa scala slitta splende strada
        scrive spruzzo sgrido sfregio sdraio sbrigo prova calendario
        autobiografia monotono pericoloso montagnoso prestigioso

    read_text:
      # Phonemically balanced passage "Il ramarro della zia" (task B1/B2).
      # Dimauro et al., IEEE Access 2017, "Assessment of Speech Intelligibility
      # in Parkinson's Disease using a Speech-to-Text System".
      source: "Dimauro et al., IEEE Access 2017"
      text: >-
        IL RAMARRO DELLA ZIA. Il papà (o il babbo come dice il piccolo Dado)
        era sul letto. Sotto di lui, accanto al lago, sedeva Gigi, detto
        Ciccio, cocco della mamma e della nonna. Vicino ad un sasso c'era una
        rosa rosso vivo e lo sciocco, vedendola, la volle per la zia. La zia
        Lulù cercava zanzare per il suo ramarro, ma dato che era giugno (o
        luglio non so bene) non ne trovava. Trovò invece una rana che saltando
        dalla strada finì nel lago con un grande spruzzo. Sai che fifa, la
        zia! Lo schizzo bagnò il suo completo rosa che divenne giallo come un
        taxi. Passava di lì un signore cosmopolita di nome Sardanapalo
        Nabucodonosor che si innamorò della zia e la portò con sé in
        Afghanistan.

    read_phrases:
      # Phonemically balanced phrases (task FB1). Same source as read_text.
      source: "Dimauro et al., IEEE Access 2017"
      text: >-
        Oggi è una bella giornata per sciare. Voglio una maglia di lana color
        ocra. Il motociclista attraversò una strada stretta di montagna.
        Patrizia ha pranzato a casa di Fabio. Questo è il tuo cappello? Dopo
        vieni a casa? La televisione funziona? Non posso aiutarti? Marco non
        è partito. Il medico non è impegnato.

  MDVR-KCL:
    read_text:
      # Jaeger, Trivedi, Stadtschnitzer. Zenodo 2019, record 2867216, appendix.
      # Everyone reads The North Wind and the Sun. Depending on constitution
      # they also read the BNC geography snippet; `text_extended` is that
      # two-passage version. The aligner tries both and keeps the better score.
      source: "Jaeger et al., Zenodo 2019 appendix"
      text: >-
        The North Wind and the Sun were disputing which was the stronger, when
        a traveler came along wrapped in a warm cloak. They agreed that the one
        who first succeeded in making the traveler take his cloak off should be
        considered stronger than the other. Then the North Wind blew as hard as
        he could, but the more he blew the more closely did the traveler fold
        his cloak around him; and at last the North Wind gave up the attempt.
        Then the Sun shone out warmly, and immediately the traveler took off
        his cloak. And so the North Wind was obliged to confess that the Sun
        was the stronger of the two.
      text_extended: >-
        The North Wind and the Sun were disputing which was the stronger, when
        a traveler came along wrapped in a warm cloak. They agreed that the one
        who first succeeded in making the traveler take his cloak off should be
        considered stronger than the other. Then the North Wind blew as hard as
        he could, but the more he blew the more closely did the traveler fold
        his cloak around him; and at last the North Wind gave up the attempt.
        Then the Sun shone out warmly, and immediately the traveler took off
        his cloak. And so the North Wind was obliged to confess that the Sun
        was the stronger of the two. This is because there is less scattering
        of blue light as the atmospheric path length and consequently the
        degree of scattering of the incoming radiation is reduced. For the
        same reason, the sun appears to be whiter and less orange-coloured as
        the observer's altitude increases; this is because a greater proportion
        of the sunlight comes directly to the observer's eye. Figure 5.7 is a
        schematic representation of the path of electromagnetic energy in the
        visible spectrum as it travels from the sun to the Earth and back again
        towards a sensor mounted on an orbiting satellite. The paths of waves
        representing energy prone to scattering (that is, the shorter
        wavelengths) as it travels from sun to Earth are shown. To the sensor
        it appears that all the energy has been reflected from point P on the
        ground whereas, in fact, it has not, because some has been scattered
        within the atmosphere and has never reached the ground at all.
